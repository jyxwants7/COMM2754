<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Playground</title>
    <link href="playground style.css" rel="stylesheet" type="text/css">
</head>

<body>
    <div id="container">
        <div class="square red"></div>
        <div class="square yellow"></div>
        <div class="circle red"></div>
        <div class="circle yellow"></div>

        <div class="square white small"></div>
        <div class="square black small"></div>
        <div class="circle white small"></div>
        <div class="circle black small"></div>

        <div class="rectangle red horizontal"></div>
        <div class="rectangle yellow vertical"></div>
        <div class="rectangle white horizontal"></div>

        <div class="line line1"></div>
        <div class="line line2"></div>
        <div class="line line3"></div>
    </div>
</body>
</html>
